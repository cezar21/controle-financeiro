name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Injetar Dependência do Compose e Usar Gradle 8.9
      run: |
        # Adiciona o plugin do Compose se não existir
        if ! grep -q "org.jetbrains.kotlin.plugin.compose" app/build.gradle.kts; then
          echo "Adicionando plugin do Compose..."
          sed -i 's/plugins {/plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0"/g' app/build.gradle.kts
        fi

        # Configura o Gradle para a versão 8.9 exigida pelo projeto
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
