name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Encontrar pasta do projeto e compilar APK
      run: |
        # Encontra onde está o arquivo gradlew automaticamente
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        
        echo "Pasta encontrada: $PROJECT_DIR"
        
        # Entra na pasta do projeto, dá permissão e compila
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
