name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Criar Gradle Wrapper se estiver faltando e Compilar APK
      run: |
        # Se o gradlew não existir, o Gradle gera ele automaticamente na raiz
        if [ ! -f "gradlew" ]; then
          echo "Gerando o gradlew que estava faltando..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
