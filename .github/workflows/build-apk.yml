name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Forçar Gradle Wrapper 8.5 e Compilar APK
      run: |
        # Baixa e configura o Gradle 8.5 de forma limpa na raiz do projeto
        gradle wrapper --gradle-version 8.5 --distribution-type bin
        
        # Garante permissão e executa a compilação
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
