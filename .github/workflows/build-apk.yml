name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Encontrar gradlew e compilar APK
      run: |
        # Localiza o arquivo gradlew onde quer que ele esteja
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        
        echo "Caminho do gradlew: $GRADLEW_PATH"
        echo "Pasta do projeto: $PROJECT_DIR"
        
        # Dá permissão usando o caminho exato e compila
        chmod +x "$GRADLEW_PATH"
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
