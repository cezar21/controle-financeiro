name: Gerar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle Wrapper Versão 8.5 e Compilar APK
      run: |
        # Força a criação do wrapper usando a versão 8.5 (compatível com o projeto)
        gradle wrapper --gradle-version 8.5
        
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
